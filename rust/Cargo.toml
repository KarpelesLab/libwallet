# libwallet — Rust backend port (single crate).
#
# The Go packages under ../wlt* are ported as modules here (db/env from
# wltbase, amount/timeid from wltobj, models/* for the object types) rather
# than separate crates. The FFI boundary lives in src/lib.rs and builds the
# cdylib the Dart client loads.

[package]
name = "libwallet"
version = "0.5.0"
edition = "2021"
license = "LicenseRef-KarpelesLab-NonCommercial"
repository = "https://github.com/KarpelesLab/libwallet"

# cdylib  -> liblibwallet.so / liblibwallet.dylib  (dlopen'd by the Dart client)
# staticlib -> liblibwallet.a (iOS static bridge)
# rlib      -> integration tests / future consumers
[lib]
name = "libwallet"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
graphitesql = "0.0.13"
xuid-rs = "0.1.0"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
num-bigint = "0.4"
num-traits = "0.2"
uuid = { version = "1", features = ["v4"] }
ethrpc-rs = "0.3.0"
base64 = "0.22"
bottlers = "0"
purecrypto = "0"
tsslib = "0.2.5"
bs58 = "0.5"
ureq = { version = "2", features = ["json"] }
tungstenite = "0.20"
outscript = "0.1.2"
spotlib = "0.1.0"

[dev-dependencies]
tempfile = "3"
base64 = "0.22"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
