[workspace]
resolver = "2"
members = ["ffi"]

# libwallet — Rust backend port.
#
# The Go packages under ../wlt* are being reimplemented here. Each Go package
# will become a member crate (wltbase, wltwallet, ...) under this workspace as
# the port progresses; for now only the FFI boundary (`ffi`) exists so the
# Dart client can talk to the Rust build exactly as it did to the Go build.

[workspace.package]
edition = "2021"
license = "LicenseRef-KarpelesLab-NonCommercial"
repository = "https://github.com/KarpelesLab/libwallet"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
