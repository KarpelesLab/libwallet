# libwallet — Rust backend port (single crate).
#
# The Go packages under ../wlt* are ported as modules here (db/env from
# wltbase, amount/timeid from wltobj, models/* for the object types) rather
# than separate crates. The FFI boundary lives in src/lib.rs and builds the
# cdylib the Dart client loads.

[package]
name = "libwallet"
version = "0.5.0"
edition = "2021"
license = "LicenseRef-KarpelesLab-NonCommercial"
repository = "https://github.com/KarpelesLab/libwallet"

# cdylib  -> liblibwallet.so / liblibwallet.dylib  (dlopen'd by the Dart client)
# staticlib -> liblibwallet.a (iOS static bridge)
# rlib      -> integration tests / future consumers
[lib]
name = "libwallet"
crate-type = ["cdylib", "staticlib", "rlib"]

# Common dependencies — compiled for every target, INCLUDING wasm32. This is the
# offline crypto core the browser wallet (src/walletcore.rs + src/wasm.rs) needs.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
num-bigint = "0.4"
num-traits = "0.2"
base64 = "0.22"
bs58 = "0.5"
# purecrypto ≥0.6.28 has a wasm32 OsRng backend (routes to a host-supplied
# `purecrypto.random_get` import — the web build wires it to
# crypto.getRandomValues), so the default features (incl. tls/quic) compile for
# wasm and no dependency patching is needed.
purecrypto = "0.6.28"
outscript = "0.1.2"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
# graphitesql (pure-Rust SQLite) is declared per-target: native uses the default
# std + filesystem VFS; the browser drops `std` (default-features = false) so its
# initial_rng_seed uses the no_std constant seed instead of SystemTime::now()
# (unsupported on wasm32) and runs against the always-available in-memory VFS.
# ID/UUID types and the key-share AEAD (bottlers) back the object models and
# keystore — pure Rust, compile for wasm (uuid gets its `js` rng below).
xuid-rs = "0.1.0"
uuid = { version = "1", features = ["v4"] }
bottlers = "0"
tsslib = "0.2.6"

# Native-only dependencies — networking (ethrpc pulls tokio), TSS, and the app
# layers that still depend on them. Being migrated to the browser incrementally.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
graphitesql = "0.1.6"
ethrpc-rs = "0.3.0"
rsurl = "0.1.5"
tungstenite = "0.20"
spotlib = "0.1.0"

# Browser (wasm32) only — the wasm-bindgen boundary. Entropy comes from
# purecrypto's wasm OsRng (host import), so no getrandom js backend is needed.
# chrono needs `wasmbind` for Utc::now() via js-sys; graphitesql's `wasm`
# feature selects its browser VFS.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
chrono = { version = "0.4", default-features = false, features = ["wasmbind"] }
graphitesql = { version = "0.1.6", default-features = false }
uuid = { version = "1", features = ["js"] }
rsurl = { version = "0.1.7", default-features = false, features = ["purecrypto-tls"] }
# spotlib's `native` feature (thread/blocking transport) is forbidden on wasm;
# the browser build uses its async fetch/WebSocket transport instead. Needed for
# the distributed keygen/sign ceremonies (Phase 2).
spotlib = { version = "0.1.1", default-features = false }
# REST-over-Spot: klbfw's `spot` feature ships `{path,verb,params}` over an
# authenticated spotlib connection to `@/p_api` and parses the KLB
# `{result,data,error}` envelope — the browser's WalletSign/RemoteKey path, so
# no HTTP Fetch, no CORS, no clientId (the Spot connection is the auth context).
klbfw = { version = "0.1.4", default-features = false, features = ["spot"] }
futures-channel = { version = "0.3", features = ["std"], default-features = false }
futures-util = { version = "0.3", features = ["std"], default-features = false }
gloo-timers = { version = "0.3", features = ["futures"] }

[dev-dependencies]
tempfile = "3"
base64 = "0.22"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
