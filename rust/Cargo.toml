# libwallet — Rust backend port (single crate).
#
# The Go packages under ../wlt* are ported as modules here (db/env from
# wltbase, amount/timeid from wltobj, models/* for the object types) rather
# than separate crates. The FFI boundary lives in src/lib.rs and builds the
# cdylib the Dart client loads.

[package]
name = "libwallet"
version = "0.5.0"
edition = "2021"
license = "LicenseRef-KarpelesLab-NonCommercial"
repository = "https://github.com/KarpelesLab/libwallet"

# cdylib  -> liblibwallet.so / liblibwallet.dylib  (dlopen'd by the Dart client)
# staticlib -> liblibwallet.a (iOS static bridge)
# rlib      -> integration tests / future consumers
[lib]
name = "libwallet"
crate-type = ["cdylib", "staticlib", "rlib"]

# Common dependencies — compiled for every target, INCLUDING wasm32. This is the
# offline crypto core the browser wallet (src/walletcore.rs + src/wasm.rs) needs.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
num-bigint = "0.4"
num-traits = "0.2"
base64 = "0.22"
bs58 = "0.5"
getrandom = "0.2"
purecrypto = "0"
outscript = "0.1.2"

# Native-only dependencies — DB, networking, threads, TSS. Excluded from the
# browser build, where none of these run (networking is done in JS via fetch).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
graphitesql = "0.0.13"
xuid-rs = "0.1.0"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
uuid = { version = "1", features = ["v4"] }
ethrpc-rs = "0.3.0"
bottlers = "0"
tsslib = "0.2.5"
rsurl = "0.1.5"
tungstenite = "0.20"
spotlib = "0.1.0"

# Browser (wasm32) only — the wasm-bindgen boundary + JS-backed RNG (getrandom's
# `js` feature routes to crypto.getRandomValues; features are additive with the
# common getrandom above).
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
tempfile = "3"
base64 = "0.22"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
