name: libwallet
description: >-
  Dart client for libwallet — a multi-chain cryptocurrency wallet library
  with TSS (Threshold Signature Scheme) key management. Supports EVM chains,
  Bitcoin, and Solana via direct FFI to the Go library.
version: 0.3.1
repository: https://github.com/KarpelesLab/libwallet
issue_tracker: https://github.com/KarpelesLab/libwallet/issues

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  ffi: ^2.0.0
  hooks: ^1.0.0
  code_assets: ^1.0.0

dev_dependencies:
  test: ^1.24.0
  lints: ^5.0.0
