name: libwallet
description: >-
  Multi-chain TSS cryptocurrency wallet client. Supports EVM, Bitcoin, Solana
  and Monacoin via direct FFI to the Go libwallet core.
version: 0.4.31
repository: https://github.com/KarpelesLab/libwallet
issue_tracker: https://github.com/KarpelesLab/libwallet/issues

environment:
  sdk: '>=3.6.0 <4.0.0'
  # Required because we declare `flutter.plugin.platforms` below;
  # pub.dev rejects the publish without an explicit lower bound.
  # The ffiPlugin key landed in Flutter 3.0; bump if other Flutter
  # APIs we touch require something newer.
  flutter: '>=3.0.0'

dependencies:
  ffi: ^2.0.0
  hooks: ^1.0.0
  code_assets: ^1.0.0
  # AtOnline session is the host's responsibility. We accept it as an
  # argument in createAgentWallet so libwallet doesn't have to manage
  # bearer tokens or refresh — the host already does that.
  atonline_api: ^0.5.0

dev_dependencies:
  test: ^1.24.0
  lints: ^5.0.0

# Declared as an FFI plugin for iOS so Flutter picks up
# `ios/libwallet.podspec` automatically. The podspec downloads the
# matching per-SDK static archives from the GitHub Release at
# pod install time and force-loads them into the host app target.
# Other platforms (Android, macOS, Linux, Windows) continue to be
# served by the build hook + code_assets path in `hook/build.dart`.
flutter:
  plugin:
    platforms:
      ios:
        ffiPlugin: true
