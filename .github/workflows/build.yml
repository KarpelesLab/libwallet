name: Build

on:
  push:
    branches: [master]
    tags: ["v*"]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go get golang.org/x/mobile/bind
          gomobile init

      - name: Install Android NDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      # Compute the linker flags once and stash them in $GITHUB_ENV so
      # every build step in the job uses identical version metadata.
      # TAG_VERSION is empty unless the workflow was triggered by a
      # `v*` tag — wltbase reads it as the "release vs dev" signal and
      # exposes it via Info:version for runtime mismatch detection.
      - name: Compute libwallet ldflags
        run: |
          GIT_TAG=$(git rev-parse --short HEAD)
          DATE_TAG=$(TZ=UTC git show -s --format=%cd --date=format-local:%Y%m%d%H%M%S HEAD)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
          else
            TAG_VERSION=""
          fi
          PKG=github.com/KarpelesLab/libwallet/wltbase
          echo "LIBWALLET_LDFLAGS=-X $PKG.dateTag=$DATE_TAG -X $PKG.gitTag=$GIT_TAG -X $PKG.version=$TAG_VERSION" >> "$GITHUB_ENV"

      - name: Build Android AAR
        # -Wl,-z,max-page-size=16384 is required on Android 15+: the OS
        # now supports 16 KB page devices (Pixel 8+ etc.) and refuses to
        # load .so files whose PT_LOAD segments are aligned below that.
        # Set via CGO_LDFLAGS so every cgo-linked .so inside the AAR
        # picks it up.
        env:
          CGO_LDFLAGS: "-Wl,-z,max-page-size=16384"
        run: |
          gomobile bind -v -target android -androidapi 21 \
            -javapkg com.karpeleslabs.libwallet \
            -ldflags="$LIBWALLET_LDFLAGS" \
            -o libwallet.aar .

      - name: Build c-shared libraries for Android (Dart FFI)
        env:
          CGO_LDFLAGS: "-Wl,-z,max-page-size=16384"
        run: |
          NDK=$ANDROID_HOME/ndk/27.2.12479018
          for arch_go_abi in "arm64:aarch64-linux-android21:android-arm64" "amd64:x86_64-linux-android21:android-x64" "arm:armv7a-linux-androideabi21:android-arm"; do
            IFS=: read -r GOARCH CC_PREFIX NAME <<< "$arch_go_abi"
            CC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/${CC_PREFIX}-clang"
            CGO_ENABLED=1 GOOS=android GOARCH=$GOARCH CC=$CC \
              go build -buildmode=c-shared -ldflags="$LIBWALLET_LDFLAGS" -o "liblibwallet-${NAME}.so" ./cshared/
          done

      - name: Verify Android .so files are 16 KB aligned
        run: |
          set -e
          fail=0
          # Dart-FFI .so files sit at the repo root.
          for so in liblibwallet-android-*.so; do
            echo "── $so ──"
            readelf -lW "$so" | awk '
              /LOAD/ {
                n = strtonum($NF)
                status = (n >= 16384) ? "OK" : "FAIL"
                printf "  %s  LOAD  Align=%s (%d)\n", status, $NF, n
                if (n < 16384) exit 1
              }' || fail=1
          done
          # .so files inside the AAR (jni/<abi>/*.so).
          tmp=$(mktemp -d)
          unzip -q libwallet.aar -d "$tmp"
          for so in "$tmp"/jni/*/*.so; do
            echo "── ${so#$tmp/} ──"
            readelf -lW "$so" | awk '
              /LOAD/ {
                n = strtonum($NF)
                status = (n >= 16384) ? "OK" : "FAIL"
                printf "  %s  LOAD  Align=%s (%d)\n", status, $NF, n
                if (n < 16384) exit 1
              }' || fail=1
          done
          rm -rf "$tmp"
          if [ $fail -ne 0 ]; then
            echo "::error::One or more Android .so files have LOAD segments aligned below 16 KB — will fail to load on Android 15+ devices."
            exit 1
          fi

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v7
        with:
          name: android
          path: |
            libwallet.aar
            libwallet-sources.aar

      - name: Upload Dart FFI artifacts (Android)
        uses: actions/upload-artifact@v7
        with:
          name: dart-android
          path: liblibwallet-android-*.so

  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go get golang.org/x/mobile/bind
          gomobile init

      - name: Compute libwallet ldflags
        run: |
          GIT_TAG=$(git rev-parse --short HEAD)
          DATE_TAG=$(TZ=UTC git show -s --format=%cd --date=format-local:%Y%m%d%H%M%S HEAD)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
          else
            TAG_VERSION=""
          fi
          PKG=github.com/KarpelesLab/libwallet/wltbase
          echo "LIBWALLET_LDFLAGS=-X $PKG.dateTag=$DATE_TAG -X $PKG.gitTag=$GIT_TAG -X $PKG.version=$TAG_VERSION" >> "$GITHUB_ENV"

      - name: Build iOS xcframework
        run: |
          gomobile bind -v --target ios,iossimulator \
            -ldflags="$LIBWALLET_LDFLAGS" \
            -o libwallet.xcframework .

      - name: Build c-archive for iOS device (Dart FFI)
        run: |
          CGO_ENABLED=1 GOOS=ios GOARCH=arm64 \
            CGO_CFLAGS="-fembed-bitcode -isysroot $(xcrun --sdk iphoneos --show-sdk-path) -miphoneos-version-min=13.0 -arch arm64" \
            CGO_LDFLAGS="-isysroot $(xcrun --sdk iphoneos --show-sdk-path) -miphoneos-version-min=13.0 -arch arm64" \
            go build -buildmode=c-archive -ldflags="$LIBWALLET_LDFLAGS" -o liblibwallet-ios-arm64.a ./cshared/

      - name: Build c-archive for iOS simulator (Dart FFI)
        run: |
          # Simulator on Apple Silicon (arm64)
          CGO_ENABLED=1 GOOS=ios GOARCH=arm64 \
            CGO_CFLAGS="-isysroot $(xcrun --sdk iphonesimulator --show-sdk-path) -mios-simulator-version-min=13.0 -arch arm64" \
            CGO_LDFLAGS="-isysroot $(xcrun --sdk iphonesimulator --show-sdk-path) -mios-simulator-version-min=13.0 -arch arm64" \
            go build -buildmode=c-archive -ldflags="$LIBWALLET_LDFLAGS" -o liblibwallet-iossimulator-arm64.a ./cshared/
          # Simulator on Intel Macs (x64)
          CGO_ENABLED=1 GOOS=ios GOARCH=amd64 \
            CGO_CFLAGS="-isysroot $(xcrun --sdk iphonesimulator --show-sdk-path) -mios-simulator-version-min=13.0 -arch x86_64" \
            CGO_LDFLAGS="-isysroot $(xcrun --sdk iphonesimulator --show-sdk-path) -mios-simulator-version-min=13.0 -arch x86_64" \
            go build -buildmode=c-archive -ldflags="$LIBWALLET_LDFLAGS" -o liblibwallet-iossimulator-x64.a ./cshared/

      - name: Build c-shared for macOS (Dart FFI)
        run: |
          # -headerpad_max_install_names reserves header space so that
          # install_name_tool can later rewrite rpath/id without relinking.
          # Dart's native_assets pipeline does exactly this on bundling.
          CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 \
            CGO_LDFLAGS="-Wl,-headerpad_max_install_names" \
            go build -buildmode=c-shared -ldflags="$LIBWALLET_LDFLAGS" -o liblibwallet-macos-arm64.dylib ./cshared/
          CGO_ENABLED=1 GOOS=darwin GOARCH=amd64 \
            CGO_LDFLAGS="-Wl,-headerpad_max_install_names" \
            go build -buildmode=c-shared -ldflags="$LIBWALLET_LDFLAGS" -o liblibwallet-macos-x64.dylib ./cshared/

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: ios
          path: libwallet.xcframework

      - name: Upload Dart FFI artifacts (iOS + macOS)
        uses: actions/upload-artifact@v7
        with:
          name: dart-apple
          path: liblibwallet-*

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      - name: Compute libwallet ldflags
        run: |
          GIT_TAG=$(git rev-parse --short HEAD)
          DATE_TAG=$(TZ=UTC git show -s --format=%cd --date=format-local:%Y%m%d%H%M%S HEAD)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
          else
            TAG_VERSION=""
          fi
          PKG=github.com/KarpelesLab/libwallet/wltbase
          echo "LIBWALLET_LDFLAGS=-X $PKG.dateTag=$DATE_TAG -X $PKG.gitTag=$GIT_TAG -X $PKG.version=$TAG_VERSION" >> "$GITHUB_ENV"

      - name: Build c-shared for Linux (Dart FFI)
        run: |
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 \
            go build -buildmode=c-shared -ldflags="$LIBWALLET_LDFLAGS" -o liblibwallet-linux-x64.so ./cshared/

      - name: Upload Dart FFI artifacts (Linux)
        uses: actions/upload-artifact@v7
        with:
          name: dart-linux
          path: liblibwallet-linux-*.so

  package:
    runs-on: ubuntu-latest
    needs: [build-android, build-ios]
    steps:
      - name: Download Android artifacts
        uses: actions/download-artifact@v8
        with:
          name: android
          path: android

      - name: Download iOS artifact
        uses: actions/download-artifact@v8
        with:
          name: ios
          path: ios/libwallet.xcframework

      - name: Create tarball
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="${GITHUB_SHA::7}"
          fi
          tar czf "libwallet-${VERSION}.tar.gz" ios android

      - name: Upload tarball
        uses: actions/upload-artifact@v7
        with:
          name: release-tarball
          path: libwallet-*.tar.gz

  release:
    runs-on: ubuntu-latest
    needs: [package, build-linux]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download tarball
        uses: actions/download-artifact@v8
        with:
          name: release-tarball

      - name: Download Dart FFI artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: dart-*
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes libwallet-*.tar.gz liblibwallet-*
