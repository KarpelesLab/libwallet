name: Build

# Builds the per-platform C-FFI native libraries (liblibwallet-<os>-<arch>.*)
# from the Rust crate under rust/. These are the artifacts the Dart client's
# hook/build.dart and ios/libwallet.podspec download from the matching GitHub
# Release. The crate exposes the same C ABI the old Go cshared library did, so
# the Dart side is unchanged; only the builder moved Go -> Rust.

on:
  push:
    branches: [master]
    tags: ["v*"]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Compute libwallet version metadata
        run: .github/scripts/version-env.sh

      - name: Build cdylib for Linux (Dart FFI)
        working-directory: rust
        run: |
          cargo build --release
          cp target/release/liblibwallet.so ../liblibwallet-linux-x64.so

      - name: Upload Dart FFI artifacts (Linux)
        uses: actions/upload-artifact@v7
        with:
          name: dart-linux
          path: liblibwallet-linux-x64.so

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Compute libwallet version metadata
        run: .github/scripts/version-env.sh

      - name: Build cdylibs for macOS (Dart FFI)
        working-directory: rust
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          cp target/aarch64-apple-darwin/release/liblibwallet.dylib ../liblibwallet-macos-arm64.dylib
          cp target/x86_64-apple-darwin/release/liblibwallet.dylib ../liblibwallet-macos-x64.dylib

      - name: Upload Dart FFI artifacts (macOS)
        uses: actions/upload-artifact@v7
        with:
          name: dart-macos
          path: liblibwallet-macos-*.dylib

  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Compute libwallet version metadata
        run: .github/scripts/version-env.sh

      - name: Build static archives for iOS device + simulator (Dart FFI)
        working-directory: rust
        run: |
          cargo build --release --target aarch64-apple-ios
          cargo build --release --target aarch64-apple-ios-sim
          cargo build --release --target x86_64-apple-ios
          cp target/aarch64-apple-ios/release/liblibwallet.a ../liblibwallet-ios-arm64.a
          cp target/aarch64-apple-ios-sim/release/liblibwallet.a ../liblibwallet-iossimulator-arm64.a
          cp target/x86_64-apple-ios/release/liblibwallet.a ../liblibwallet-iossimulator-x64.a

      - name: Upload Dart FFI artifacts (iOS)
        uses: actions/upload-artifact@v7
        with:
          name: dart-ios
          path: liblibwallet-ios*.a

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android,armv7-linux-androideabi
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Set up Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Compute libwallet version metadata
        run: .github/scripts/version-env.sh

      - name: Build cdylibs for Android (Dart FFI, 16 KB aligned)
        working-directory: rust
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          # Android 15+ (16 KB page devices) refuses .so files whose PT_LOAD
          # segments align below 16 KB — force the linker to 16 KB.
          RUSTFLAGS: "-C link-arg=-Wl,-z,max-page-size=16384"
        run: |
          cargo ndk -t arm64-v8a -t x86_64 -t armeabi-v7a build --release
          cp target/aarch64-linux-android/release/liblibwallet.so ../liblibwallet-android-arm64.so
          cp target/x86_64-linux-android/release/liblibwallet.so ../liblibwallet-android-x64.so
          cp target/armv7-linux-androideabi/release/liblibwallet.so ../liblibwallet-android-arm.so

      - name: Verify Android .so files are 16 KB aligned
        run: |
          set -e
          for so in liblibwallet-android-*.so; do
            echo "── $so ──"
            readelf -lW "$so" | awk '
              /LOAD/ {
                n = strtonum($NF)
                printf "  %s  LOAD  Align=%s (%d)\n", (n >= 16384 ? "OK" : "FAIL"), $NF, n
                if (n < 16384) exit 1
              }'
          done

      - name: Upload Dart FFI artifacts (Android)
        uses: actions/upload-artifact@v7
        with:
          name: dart-android
          path: liblibwallet-android-*.so

  release:
    runs-on: ubuntu-latest
    needs: [build-linux, build-macos, build-ios, build-android]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download all FFI artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: dart-*
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes liblibwallet-*
