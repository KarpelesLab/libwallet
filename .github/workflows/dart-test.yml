name: Dart Tests

# The Dart client (dart/) loads the Rust-built C-FFI library. These jobs build
# that library from the crate under rust/ for each platform, stage it where the
# Dart FFI loader / iOS podspec expect it, then run the Dart + integration
# tests. Only the native-build steps moved Go -> Rust; the Dart tests are
# unchanged.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  # Unit tests + host integration tests (Rust FFI cdylib + flutter test)
  test-host:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      # Flutter is the test runner here: libwallet's Dart side depends on
      # atonline_api (which transitively pulls in Flutter via
      # flutter_secure_storage), so `dart test` fails to load any file that
      # imports `package:libwallet/libwallet.dart` — `flutter test` compiles
      # those imports correctly.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      # Bake version metadata into the FFI lib so the integration test's
      # Info:version assertion sees populated dateTag/gitTag.
      - name: Compute libwallet version metadata
        run: .github/scripts/version-env.sh

      - name: Build FFI cdylib for host (Dart local-dev path)
        run: |
          mkdir -p dart/testserver
          cd rust && cargo build --release
          cp target/release/liblibwallet.dylib ../dart/testserver/liblibwallet.dylib

      - name: Install Dart dependencies
        working-directory: dart
        run: flutter pub get

      - name: Run Dart analysis
        working-directory: dart
        run: flutter analyze lib test hook

      # Belt-and-suspenders for the version-constant lockstep:
      # version_constant_test.dart catches drift if you run the tests, but if a
      # release commit only updates pubspec.yaml without touching anything in
      # test/, the test wouldn't run on PR. The CLI check covers that case.
      - name: Verify pubspec ↔ lib/src/version.dart lockstep
        working-directory: dart
        run: dart run tools/bump_version.dart --check

      - name: Run Dart unit tests
        working-directory: dart
        run: flutter test test/amount_test.dart test/models_test.dart test/response_test.dart test/version_constant_test.dart test/clawdwallet_pair_test.dart

      - name: Run FFI integration tests
        working-directory: dart
        run: flutter test --concurrency=1 test/ffi_integration_test.dart

  # iOS simulator integration tests (FFI via Rust static archive).
  # The Xcode build for the test host takes 25-40 minutes on CI.
  test-ios:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Compute libwallet version metadata
        run: .github/scripts/version-env.sh

      - name: Build static archives for iOS (device + both sim arches)
        # The ios/libwallet.podspec wraps these into a libwallet.xcframework at
        # pod install time. When the per-SDK files exist in dart/ios/,
        # prepare_command skips the GitHub Release download — that's the path we
        # want for CI on master, since pre-release commits have no matching
        # release yet. We MUST build both sim arches (arm64 + x86_64) even
        # though the runner only uses arm64: Xcode targets the iphonesimulator
        # SDK for all arches, and CocoaPods rejects an xcframework whose
        # simulator slice doesn't cover x86_64. prepare_command lipo's the two
        # sim slices into liblibwallet-iossimulator.a before xcodebuild.
        run: |
          cd rust
          cargo build --release --target aarch64-apple-ios
          cargo build --release --target aarch64-apple-ios-sim
          cargo build --release --target x86_64-apple-ios
          cp target/aarch64-apple-ios/release/liblibwallet.a ../dart/ios/liblibwallet-ios-arm64.a
          cp target/aarch64-apple-ios-sim/release/liblibwallet.a ../dart/ios/liblibwallet-iossimulator-arm64.a
          cp target/x86_64-apple-ios/release/liblibwallet.a ../dart/ios/liblibwallet-iossimulator-x64.a

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Reset CoreSimulator + boot iOS simulator
        run: |
          set -euo pipefail
          # The "Application ... is unknown to FrontBoard" / "Simulator device
          # failed to launch" failures were caused by stale state inside the
          # CoreSimulator service, which survives across jobs on the hosted
          # runner pool. The fix: shutdown every booted sim, erase device
          # contents, let CoreSimulator restart with a clean device pool.
          xcrun simctl shutdown all 2>/dev/null || true
          xcrun simctl erase all
          killall Simulator 2>/dev/null || true

          # Pick the most recent iPhone available from the preinstalled device
          # pool, filtered to runtimes whose major version matches Xcode's
          # iphonesimulator SDK so we never land on a preview runtime whose
          # deployment target gates the test app's launch.
          SDK_MAJOR=$(xcrun --sdk iphonesimulator --show-sdk-version | cut -d. -f1)
          echo "Xcode iphonesimulator SDK major = $SDK_MAJOR"

          DEVICES_JSON=$(xcrun simctl list devices available -j)
          PICK_PIPELINE='
            map(select(.isAvailable and (.name | test("^iPhone [0-9]+($| Plus$| Pro$| Pro Max$)")))
                | { udid, name,
                    model: (.name | capture("iPhone (?<n>[0-9]+)") | .n | tonumber),
                    variant: (
                      if (.name | endswith(" Pro Max")) then 3
                      elif (.name | endswith(" Pro"))     then 2
                      elif (.name | endswith(" Plus"))    then 1
                      else 0 end)
                  })
            | sort_by([.model, .variant])
            | last // empty
          '
          PICK=$(echo "$DEVICES_JSON" | jq -r --arg major "$SDK_MAJOR" '
            .devices
            | to_entries
            | map(select(.key | test("iOS-" + $major + "(-|$)")))
            | map(.value[])
          ' | jq -r "$PICK_PIPELINE")
          if [ -z "$PICK" ] || [ "$PICK" = "null" ]; then
            echo "No iPhone matching iOS-$SDK_MAJOR runtime; falling back to any iPhone"
            PICK=$(echo "$DEVICES_JSON" | jq -r '
              .devices
              | to_entries
              | map(.value[])
            ' | jq -r "$PICK_PIPELINE")
          fi
          if [ -z "$PICK" ] || [ "$PICK" = "null" ]; then
            echo "No usable iPhone simulator found"; exit 1
          fi
          DEVICE_ID=$(echo "$PICK" | jq -r '.udid')
          DEVICE_NAME=$(echo "$PICK" | jq -r '.name')
          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"
          echo "Using simulator: $DEVICE_NAME ($DEVICE_ID)"

          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b
          for i in $(seq 1 30); do
            if xcrun simctl spawn "$DEVICE_ID" launchctl print system 2>/dev/null | grep -q 'com.apple.SpringBoard$'; then
              echo "SpringBoard ready after ${i}s"
              break
            fi
            sleep 1
          done

      - name: Install Flutter dependencies
        working-directory: dart/test_app
        run: flutter pub get

      - name: Run iOS integration tests (xcodebuild test)
        working-directory: dart/test_app
        # Run the integration test as a native XCTest via xcodebuild (the same
        # mechanism Flutter's engine CI uses) rather than `flutter test`, which
        # hits an mDNS attach race on the hosted runner. CODE_SIGNING_ALLOWED=NO
        # because the simulator ignores signatures.
        run: |
          set +e
          flutter build ios --config-only --simulator integration_test/libwallet_test.dart || exit $?
          XCRESULT="$RUNNER_TEMP/xcodebuild-test.xcresult"
          rm -rf "$XCRESULT"
          xcodebuild test \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -only-testing:RunnerTests \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -resultBundlePath "$XCRESULT" \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO
          EXIT=$?
          if [ "$EXIT" != "0" ] && [ -d "$XCRESULT" ]; then
            echo "::group::xcresulttool — failure scan"
            (
              xcrun xcresulttool get test-results tests --path "$XCRESULT" 2>/dev/null
              xcrun xcresulttool get --legacy --path "$XCRESULT" --format json 2>/dev/null
            ) | jq -r '
                  .. | objects |
                  ( .failureText? // empty | "FAIL: " + tostring ),
                  ( .failureMessages? // empty | (if type == "array" then .[] else . end) | "FAIL: " + tostring ),
                  ( .message? // empty
                    | (if type == "object" then ._value? else . end)
                    | select(. != null and . != "")
                    | "MSG : " + tostring )
                ' 2>/dev/null | sort -u
            echo "::endgroup::"
          fi
          exit "$EXIT"

      - name: Cleanup simulator
        if: always()
        run: |
          if [ -n "${DEVICE_ID:-}" ]; then
            xcrun simctl shutdown "$DEVICE_ID" 2>/dev/null || true
          fi

  # Android emulator integration tests (FFI via Rust cdylib)
  test-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Set up Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Compute libwallet version metadata
        run: .github/scripts/version-env.sh

      - name: Build FFI cdylib for Android x86_64 (emulator ABI)
        working-directory: rust
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          mkdir -p ../dart/test_app/android/app/src/main/jniLibs/x86_64
          cargo ndk -t x86_64 build --release
          cp target/x86_64-linux-android/release/liblibwallet.so \
            ../dart/test_app/android/app/src/main/jniLibs/x86_64/liblibwallet.so

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Flutter dependencies
        working-directory: dart/test_app
        run: flutter pub get

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android integration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: cd dart/test_app && flutter test integration_test/libwallet_test.dart -d emulator-5554 || test $? -eq 79
