name: Dart Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  # Unit tests + host integration tests (Go test server + dart test)
  test-host:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      - uses: dart-lang/setup-dart@v1

      - name: Build test server
        run: go build -o dart/testserver/testserver ./dart/testserver/

      - name: Build c-shared library for FFI tests
        run: CGO_ENABLED=1 go build -buildmode=c-shared -o dart/testserver/liblibwallet.dylib ./cshared/

      - name: Install Dart dependencies
        working-directory: dart
        run: dart pub get

      - name: Run Dart analysis
        working-directory: dart
        run: dart analyze lib test hook

      - name: Run Dart unit tests
        working-directory: dart
        run: dart test test/amount_test.dart test/models_test.dart test/request_test.dart test/response_test.dart

      - name: Run socket integration tests
        working-directory: dart
        run: dart test test/integration_test.dart

      - name: Run FFI integration tests
        working-directory: dart
        run: dart test test/ffi_integration_test.dart

  # iOS simulator integration tests (FFI via c-archive)
  test-ios:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      - name: Build c-archive for iOS simulator
        run: |
          # Build static library for iOS simulator (arm64 for Apple Silicon runners)
          CGO_ENABLED=1 GOOS=ios GOARCH=arm64 \
            SDK=iphonesimulator \
            CGO_CFLAGS="-fembed-bitcode -isysroot $(xcrun --sdk iphonesimulator --show-sdk-path) -mios-simulator-version-min=13.0 -arch arm64" \
            CGO_LDFLAGS="-isysroot $(xcrun --sdk iphonesimulator --show-sdk-path) -mios-simulator-version-min=13.0 -arch arm64" \
            go build -buildmode=c-archive -o dart/test_app/ios/liblibwallet.a ./cshared/

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Boot iOS simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | \
            python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for runtime, devices in data['devices'].items():
              if 'iOS' in runtime:
                  for d in devices:
                      if 'iPhone' in d['name'] and d['isAvailable']:
                          print(d['udid'])
                          sys.exit(0)
          sys.exit(1)
          ")
          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE_ID"

      - name: Install Flutter dependencies
        working-directory: dart/test_app
        run: flutter pub get

      - name: Run iOS integration tests
        working-directory: dart/test_app
        run: flutter test integration_test/libwallet_test.dart -d "$DEVICE_ID"

  # Android emulator integration tests (FFI via c-shared)
  test-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      - name: Install Android NDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Build c-shared library for Android x86_64
        run: |
          # The emulator is x86_64, so we only need that ABI
          NDK=$ANDROID_HOME/ndk/27.2.12479018
          export CC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android21-clang"
          export CXX="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android21-clang++"
          CGO_ENABLED=1 GOOS=android GOARCH=amd64 \
            go build -buildmode=c-shared \
            -o dart/test_app/android/app/src/main/jniLibs/x86_64/liblibwallet.so \
            ./cshared/

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Flutter dependencies
        working-directory: dart/test_app
        run: flutter pub get

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android integration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: cd dart/test_app && flutter test integration_test/libwallet_test.dart -d emulator-5554
