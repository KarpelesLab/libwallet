name: Dart Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  # Unit tests + host integration tests (Go test server + dart test)
  test-host:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      - uses: dart-lang/setup-dart@v1

      - name: Build c-shared library for FFI tests
        run: |
          CGO_ENABLED=1 CGO_LDFLAGS="-Wl,-headerpad_max_install_names" \
            go build -buildmode=c-shared \
            -o dart/testserver/liblibwallet.dylib ./cshared/

      - name: Install Dart dependencies
        working-directory: dart
        run: dart pub get

      - name: Run Dart analysis
        working-directory: dart
        run: dart analyze lib test hook

      - name: Run Dart unit tests
        working-directory: dart
        run: dart test test/amount_test.dart test/models_test.dart test/response_test.dart

      - name: Run FFI integration tests
        working-directory: dart
        run: |
          # The Go c-shared runtime's background goroutines can crash on
          # process exit when the Dart VM tears down NativeCallable pointers.
          # All tests pass before the exit crash, so accept exit code 134 (SIGABRT).
          dart test --concurrency=1 test/ffi_integration_test.dart || {
            EXIT=$?
            if [ $EXIT -eq 134 ]; then
              echo "Go runtime exit crash (expected with c-shared + dart test)"
            else
              exit $EXIT
            fi
          }

  # iOS simulator integration tests (FFI via c-archive).
  # The Xcode build for the test host takes 25-40 minutes on CI.
  # Happy path including tests is ~8 min; we've seen 20-25 min runs
  # on slow runners though, so keep 30 min as the cap. All libwallet
  # RPC calls are bounded by a 30 s timeout internally, so any real
  # hang fails fast rather than stalling the whole pipeline.
  test-ios:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      - name: Build c-archive slices for iOS (sim arm64 + device arm64)
        run: |
          # The ios/libwallet.podspec expects per-SDK archives in dart/ios/.
          # If they're already present, prepare_command skips the GitHub
          # Release download — that's the path we want for CI on master,
          # since pre-release commits don't have a matching release yet.
          #
          # CI only runs on the iOS simulator (apple silicon runner = arm64),
          # so we build the sim-arm64 slice (needed for actual link) and a
          # device-arm64 slice (needed only because the podspec preserves
          # all per-SDK archives as preserve_paths). x64 simulator slice is
          # not built — the sim-arm64 archive is dropped in as the "fat"
          # simulator file directly (single-arch is a valid fat archive).
          CGO_ENABLED=1 GOOS=ios GOARCH=arm64 \
            CGO_CFLAGS="-isysroot $(xcrun --sdk iphonesimulator --show-sdk-path) -mios-simulator-version-min=13.0 -arch arm64" \
            CGO_LDFLAGS="-isysroot $(xcrun --sdk iphonesimulator --show-sdk-path) -mios-simulator-version-min=13.0 -arch arm64" \
            go build -buildmode=c-archive -o dart/ios/liblibwallet-iossimulator.a ./cshared/
          CGO_ENABLED=1 GOOS=ios GOARCH=arm64 \
            CGO_CFLAGS="-fembed-bitcode -isysroot $(xcrun --sdk iphoneos --show-sdk-path) -miphoneos-version-min=13.0 -arch arm64" \
            CGO_LDFLAGS="-isysroot $(xcrun --sdk iphoneos --show-sdk-path) -miphoneos-version-min=13.0 -arch arm64" \
            go build -buildmode=c-archive -o dart/ios/liblibwallet-ios-arm64.a ./cshared/

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Boot iOS simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | \
            python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for runtime, devices in data['devices'].items():
              if 'iOS' in runtime:
                  for d in devices:
                      if 'iPhone' in d['name'] and d['isAvailable']:
                          print(d['udid'])
                          sys.exit(0)
          sys.exit(1)
          ")
          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE_ID"
          # Block until the simulator is fully booted. Without this,
          # `simctl boot` returns as soon as the boot process starts
          # but services (including the Dart VM discovery path) may
          # not yet be ready — flutter test's attach can then silently
          # retry-then-timeout. This matches ~40% of the flaky runs.
          xcrun simctl bootstatus "$DEVICE_ID" -b

      - name: Install Flutter dependencies
        working-directory: dart/test_app
        run: flutter pub get

      - name: Run iOS integration tests
        working-directory: dart/test_app
        # `flutter test` on the iOS simulator periodically hangs at
        # "Waiting for VM Service port to be available" — a known
        # Flutter + sim mDNS / port-publish race that has nothing to
        # do with libwallet (confirmed: setUpAll never starts on hung
        # runs).
        #
        # Failure signature: Flutter's own internal timeout fires at
        # ~7m43s with exit 1 and '0 tests passed' — LOOKS identical
        # to a real test failure to any naive retry-on-nonzero-exit
        # loop. We differentiate by scanning the captured output for
        # 'Waiting for VM Service port to be available' AND '0 tests
        # passed'; that conjunction only happens on the attach hang.
        # Any other failure (a real test regression) is surfaced
        # immediately so we never mask a real bug.
        run: |
          set +e
          LOG=$RUNNER_TEMP/flutter-test.log
          for attempt in 1 2; do
            echo "::group::flutter test attempt $attempt"
            flutter test --verbose integration_test/libwallet_test.dart -d "$DEVICE_ID" 2>&1 | tee "$LOG"
            EXIT=${PIPESTATUS[0]}
            echo "::endgroup::"
            if [ $EXIT -eq 0 ]; then
              exit 0
            fi
            if grep -q "Waiting for VM Service port to be available" "$LOG" \
               && grep -q "0 tests passed" "$LOG"; then
              echo "Attempt $attempt: VM Service attach hang (flake); rebooting sim and retrying"
              xcrun simctl shutdown "$DEVICE_ID" || true
              xcrun simctl boot "$DEVICE_ID"
              xcrun simctl bootstatus "$DEVICE_ID" -b
              continue
            fi
            echo "flutter test failed with exit $EXIT (real failure, not the attach hang) — not retrying"
            exit $EXIT
          done
          echo "Both attempts hit the VM Service attach hang"
          exit 1

  # Android emulator integration tests (FFI via c-shared)
  test-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      - name: Install Android NDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Build c-shared library for Android x86_64
        run: |
          # The emulator is x86_64, so we only need that ABI
          NDK=$ANDROID_HOME/ndk/27.2.12479018
          export CC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android21-clang"
          export CXX="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android21-clang++"
          CGO_ENABLED=1 GOOS=android GOARCH=amd64 \
            go build -buildmode=c-shared \
            -o dart/test_app/android/app/src/main/jniLibs/x86_64/liblibwallet.so \
            ./cshared/

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Flutter dependencies
        working-directory: dart/test_app
        run: flutter pub get

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android integration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: cd dart/test_app && flutter test integration_test/libwallet_test.dart -d emulator-5554 || test $? -eq 79
