name: Publish Dart to pub.dev

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  publish:
    runs-on: ubuntu-latest
    # Wait for the Go library release to be created with all binaries,
    # otherwise the Dart package's hook/build.dart would fail on install.
    needs: []
    permissions:
      id-token: write   # Required for OIDC authentication with pub.dev
    steps:
      - uses: actions/checkout@v6

      # The package declares `flutter.plugin.platforms` and a Flutter
      # SDK lower bound (required by pub.dev), so `dart pub get` and
      # `dart pub publish` need a Flutter install on PATH — plain
      # `dart-lang/setup-dart` would fail with
      # "libwallet requires the Flutter SDK, version solving failed".
      # Using `subosito/flutter-action` instead also brings the
      # bundled Dart SDK along, so `dart pub publish` keeps working.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Verify tag matches pubspec version
        working-directory: dart
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PUBSPEC_VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          if [ "$TAG_VERSION" != "$PUBSPEC_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) doesn't match pubspec.yaml version ($PUBSPEC_VERSION)"
            exit 1
          fi
          echo "Publishing libwallet $PUBSPEC_VERSION"

      - name: Wait for Go release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # The Build workflow must have already created the GitHub Release
          # with c-shared binaries. Poll for the release to exist.
          for i in {1..60}; do
            if gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' 2>/dev/null | grep -q 'liblibwallet-'; then
              echo "Release $GITHUB_REF_NAME has binary assets, proceeding"
              break
            fi
            echo "Waiting for release $GITHUB_REF_NAME binary assets... ($i/60)"
            sleep 30
          done

      - name: Install Dart dependencies
        working-directory: dart
        run: dart pub get

      - name: Publish
        working-directory: dart
        run: dart pub publish --force
