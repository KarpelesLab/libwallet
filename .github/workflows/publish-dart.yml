name: Publish Dart to pub.dev

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  # workflow_dispatch lets us retry the publish for an already-pushed
  # tag without deleting + force-pushing it. Required when `dart pub
  # publish --force` hangs (it has happened — v0.4.51 stuck for 2h+
  # with no per-attempt timeout, and a re-push of the existing tag
  # doesn't fire a new push event).
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v0.4.51)'
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    # 45-minute cap — far above the ~5-8 min a healthy publish takes,
    # but tight enough that a hung `dart pub publish --force` doesn't
    # burn the GitHub Actions 6-hour job ceiling before anyone notices.
    # The per-attempt timeout below handles the same hang at a finer
    # granularity (15 min × 3 attempts), this is the backstop.
    timeout-minutes: 45
    # Wait for the Go library release to be created with all binaries,
    # otherwise the Dart package's hook/build.dart would fail on install.
    needs: []
    permissions:
      id-token: write   # Required for OIDC authentication with pub.dev
    steps:
      - uses: actions/checkout@v6
        with:
          # workflow_dispatch may point at a tag that isn't HEAD of
          # master; for tag-triggered runs GITHUB_REF_NAME is already
          # the tag, so this is a no-op on the normal path.
          ref: ${{ github.event.inputs.tag || github.ref }}

      # Two SDKs needed:
      # - subosito/flutter-action installs Flutter (required because
      #   `flutter.plugin.platforms` in pubspec.yaml pulls in the
      #   Flutter SDK as a hard dependency for `dart pub get`).
      # - dart-lang/setup-dart wires the OIDC ↔ pub.dev credential
      #   plumbing that `dart pub publish` reads from. Flutter's
      #   bundled Dart does not do this, and without it `dart pub
      #   publish --force` hangs indefinitely waiting for an interactive
      #   auth flow that GitHub Actions has no terminal to provide.
      # Order matters: setup-dart runs second so its Dart binary wins
      # on PATH and the credentials it set up are the active ones.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: dart-lang/setup-dart@v1

      - name: Verify tag matches pubspec version
        working-directory: dart
        env:
          # On a tag push GITHUB_REF_NAME is `v0.4.51`; on a
          # workflow_dispatch it's the dispatched ref (`master`),
          # so fall back to the explicit tag input there.
          TARGET_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          TAG_VERSION="${TARGET_TAG#v}"
          PUBSPEC_VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          if [ "$TAG_VERSION" != "$PUBSPEC_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) doesn't match pubspec.yaml version ($PUBSPEC_VERSION)"
            exit 1
          fi
          echo "Publishing libwallet $PUBSPEC_VERSION"

      - name: Wait for Go release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          # See the matching env note on the Verify step — fall back to
          # the dispatch input on a workflow_dispatch run.
          TARGET_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          # The Build workflow must have already created the GitHub Release
          # with c-shared binaries. Poll for the release to exist.
          for i in {1..60}; do
            if gh release view "$TARGET_TAG" --json assets --jq '.assets[].name' 2>/dev/null | grep -q 'liblibwallet-'; then
              echo "Release $TARGET_TAG has binary assets, proceeding"
              break
            fi
            echo "Waiting for release $TARGET_TAG binary assets... ($i/60)"
            sleep 30
          done

      - name: Install Dart dependencies
        working-directory: dart
        run: dart pub get

      - name: Publish
        working-directory: dart
        # `dart pub publish` resolves credentials against pub.dev via the
        # GitHub OIDC token. Pub.dev periodically rejects the JWT with
        # "Invalid timestamps" (clock-skew / OIDC issuer cache eviction);
        # we hit it on v0.4.20. The exchange is otherwise idempotent —
        # if the upload already landed on attempt 1 (rare for a 400 path
        # but possible) pub.dev refuses a duplicate version on attempt 2
        # and we treat that as success. Three attempts with backoff.
        run: |
          set +e
          # Per-attempt watchdog. A healthy publish round-trip lands in
          # 1-3 min, so 15 min is well above the worst observed real
          # case and tight enough that a stuck attempt (saw 2h+ on
          # v0.4.51) gets killed and falls through to the next retry.
          # Without this cap an indefinitely-hung `dart pub publish`
          # eats the whole job budget and the in-loop retries never
          # fire.
          PER_ATTEMPT_TIMEOUT=900
          for attempt in 1 2 3; do
            echo "::group::dart pub publish attempt $attempt (timeout ${PER_ATTEMPT_TIMEOUT}s)"
            timeout --signal=TERM --kill-after=10 "$PER_ATTEMPT_TIMEOUT" \
              dart pub publish --force
            EXIT=$?
            echo "::endgroup::"
            if [ "$EXIT" = "0" ]; then
              echo "publish succeeded on attempt $attempt"
              exit 0
            fi
            # Idempotency: pub.dev rejects re-uploading the same version,
            # which means a prior attempt already landed it. Treat as
            # success — better than failing a release that's already live.
            VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
            if curl -sf "https://pub.dev/api/packages/libwallet/versions/$VERSION" >/dev/null 2>&1; then
              echo "Version $VERSION is already on pub.dev — treating as success"
              exit 0
            fi
            # Exit 124 = timeout reached SIGTERM, 137 = follow-up SIGKILL.
            # Surface those in the log so the cause is grep-able.
            if [ "$EXIT" = "124" ] || [ "$EXIT" = "137" ]; then
              echo "publish attempt $attempt timed out at ${PER_ATTEMPT_TIMEOUT}s (exit $EXIT)"
            fi
            if [ "$attempt" = "3" ]; then
              echo "publish failed on all 3 attempts (last exit $EXIT)"
              exit "$EXIT"
            fi
            echo "publish attempt $attempt failed (exit $EXIT); retrying after backoff"
            sleep $((attempt * 10))
          done
