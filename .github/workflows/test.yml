name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -v -timeout 5m -covermode=count -coverprofile=coverage.out ./...

      - name: Coveralls
        uses: coverallsapp/github-action@v2
        with:
          file: coverage.out
